[project]
name = "claude-lb"
version = "0.5.0"
description = "Anthropic API key load balancer & proxy with usage tracking, rate-limit-aware routing, and a dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "claude-lb contributors" }]
keywords = [
    "anthropic",
    "claude",
    "claude-code",
    "llm-gateway",
    "load-balancer",
    "proxy",
    "prompt-caching",
    "cost-tracking",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "typer>=0.15",
    "rich>=13",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[project.scripts]
claude-lb = "app.cli:app"

[project.urls]
Homepage = "https://github.com/softkleenex/claude-lb"
Issues = "https://github.com/softkleenex/claude-lb/issues"
Changelog = "https://github.com/softkleenex/claude-lb/blob/main/CHANGELOG.md"
Source = "https://github.com/softkleenex/claude-lb"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
