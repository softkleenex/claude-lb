[project]
name = "claude-lb"
version = "0.5.0"
description = "Anthropic API key load balancer & proxy with usage tracking, rate-limit-aware routing, and a dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "claude-lb contributors" }]
keywords = ["anthropic", "claude", "load-balancer", "proxy", "fastapi", "usage-tracking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "typer>=0.15",
    "rich>=13",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[project.scripts]
claude-lb = "app.cli:app"

[project.urls]
Homepage = "https://github.com/softkleenex/claude-lb"
Issues = "https://github.com/softkleenex/claude-lb/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
