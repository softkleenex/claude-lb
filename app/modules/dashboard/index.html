<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-lb</title>
<style>
  :root {
    --bg: #fbfaf9; --panel: #ffffff; --border: #e6e2dd; --text: #1c1b1a;
    --muted: #6b6560; --accent: #c2603c; --ok: #2f7d5d; --warn: #b8860b; --err: #b3402e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --panel: #201e1c; --border: #33302c; --text: #eeeae5;
      --muted: #9a938c; --accent: #e07d55; --ok: #4fb185; --warn: #d9a441; --err: #e0705c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 18px 24px; border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
  h2 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .sub { color: var(--muted); font-size: 13px; }
  main { padding: 24px; display: grid; gap: 20px; max-width: 1200px; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .tile .label { color: var(--muted); font-size: 12px; }
  .tile .value { font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  td.num, th.num { text-align: right; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid currentColor; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  .bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; min-width: 60px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  button {
    font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  input, select {
    font: inherit; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
  }
  label.field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  form.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  .empty { color: var(--muted); padding: 10px 0; }
  .chart { width: 100%; height: 160px; display: block; overflow: visible; }
  .chart .col { fill: var(--accent); opacity: 0.85; }
  .chart .col:hover { opacity: 1; }
  .chart .axis { stroke: var(--border); stroke-width: 1; }
  .toast { margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--accent); color: var(--accent); }
  .toast code { word-break: break-all; }
  .banner {
    margin: 0 24px; margin-top: 18px; padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--warn); color: var(--warn); font-size: 13px;
  }
  /* Login gate */
  #gate {
    position: fixed; inset: 0; display: none; place-items: center;
    background: var(--bg); padding: 24px; z-index: 10;
  }
  #gate.show { display: grid; }
  #gate .card {
    width: min(420px, 100%); background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px;
  }
  #gate h1 { margin-bottom: 4px; }
  #gate p { color: var(--muted); font-size: 13px; margin: 8px 0 18px; }
  #gate input { width: 100%; margin-bottom: 10px; }
  #gate button { width: 100%; }
  #gate .msg { margin-top: 12px; font-size: 13px; }
  body.locked > header, body.locked > main, body.locked > .banner { display: none; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>claude-lb</h1>
    <p id="gate-hint"></p>
    <form id="gate-form">
      <input id="gate-password" type="password" placeholder="Password" autocomplete="current-password" required>
      <input id="gate-password2" type="password" placeholder="Confirm password" autocomplete="new-password" style="display:none">
      <input id="gate-totp" type="text" inputmode="numeric" placeholder="6-digit code" autocomplete="one-time-code" style="display:none">
      <input id="gate-bootstrap" type="text" placeholder="Bootstrap token (from the server log)" style="display:none">
      <button class="primary" type="submit" id="gate-submit">Sign in</button>
    </form>
    <div class="msg err" id="gate-error"></div>
  </div>
</div>

<header>
  <h1>claude-lb</h1>
  <span class="sub" id="meta">loading…</span>
  <span style="flex:1"></span>
  <select id="window">
    <option value="1">last 1h</option>
    <option value="24" selected>last 24h</option>
    <option value="168">last 7d</option>
    <option value="720">last 30d</option>
  </select>
  <button id="refresh">Refresh</button>
  <button id="signout" style="display:none">Sign out</button>
</header>

<div class="banner" id="insecure-banner" style="display:none"></div>

<main>
  <section>
    <h2>Totals</h2>
    <div class="tiles" id="totals"></div>
  </section>

  <section>
    <h2>Accounts</h2>
    <div id="toast"></div>
    <form class="row" id="account-form">
      <input name="name" placeholder="name" required>
      <input name="api_key" placeholder="sk-ant-…" required size="28" type="password">
      <input name="weight" placeholder="weight" type="number" step="0.1" value="1" style="width:90px">
      <input name="priority" placeholder="priority" type="number" value="0" style="width:90px">
      <button type="submit">Add account</button>
    </form>
    <div class="scroll"><table id="accounts"></table></div>
  </section>

  <section>
    <h2>Routing</h2>
    <div class="row" id="settings-row"></div>
    <div class="sub" id="settings-note"></div>
  </section>

  <section>
    <h2>Cost trend</h2>
    <div id="trend"></div>
  </section>

  <section>
    <h2>Usage by model</h2>
    <div class="scroll"><table id="models"></table></div>
  </section>

  <section>
    <h2>API keys</h2>
    <form class="row" id="key-form">
      <input name="name" placeholder="name" required>
      <input name="max_cost_usd_per_window" placeholder="$ / window" type="number" step="0.01" style="width:130px">
      <input name="window_seconds" placeholder="window (s)" type="number" value="3600" style="width:120px">
      <button type="submit">Issue key</button>
    </form>
    <div class="scroll"><table id="keys"></table></div>
  </section>

  <section>
    <h2>Recent requests</h2>
    <div class="scroll"><table id="requests"></table></div>
  </section>

  <section>
    <h2>Model catalog</h2>
    <div class="row">
      <button id="sync-models">Sync from upstream</button>
      <button id="probe-now">Probe unhealthy accounts</button>
      <span class="sub" id="catalog-note"></span>
    </div>
    <div class="scroll"><table id="catalog"></table></div>
  </section>

  <section>
    <h2>Security</h2>
    <div class="row" id="security-row"></div>
    <div id="totp-setup"></div>
  </section>

  <section>
    <h2>Audit log</h2>
    <div class="scroll"><table id="audit"></table></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const fmt = new Intl.NumberFormat();
const usd = (n) => "$" + (n ?? 0).toFixed(4);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

let bootstrapToken = null;

class AuthRequired extends Error {}

async function api(path, options = {}) {
  const headers = { "content-type": "application/json", ...(options.headers || {}) };
  if (bootstrapToken) headers["x-claude-lb-bootstrap"] = bootstrapToken;
  const res = await fetch(path, { ...options, headers });
  if (res.status === 401) throw new AuthRequired("authentication required");
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail ?? detail; } catch {}
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  return res.status === 204 ? null : res.json();
}

function table(el, columns, rows, renderRow) {
  if (!rows.length) {
    el.innerHTML = `<tr><td class="empty">nothing yet</td></tr>`;
    return;
  }
  const head = columns.map((c) => `<th class="${c.num ? "num" : ""}">${esc(c.label)}</th>`).join("");
  el.innerHTML = `<thead><tr>${head}</tr></thead><tbody>${rows.map(renderRow).join("")}</tbody>`;
}

function toast(message, isError) {
  $("#toast").innerHTML =
    `<div class="toast" style="${isError ? "border-color:var(--err);color:var(--err)" : ""}">${message}</div>`;
  if (!isError) setTimeout(() => ($("#toast").innerHTML = ""), 20000);
}

// ---------------------------------------------------------------- auth gate

function showGate(status) {
  document.body.classList.add("locked");
  $("#gate").classList.add("show");
  const setup = !status.configured;
  $("#gate-hint").textContent = setup
    ? "No password is set yet. Choose one to protect the dashboard and management API."
    : "Sign in to continue.";
  $("#gate-password").placeholder = setup ? "New password (min 8 characters)" : "Password";
  $("#gate-password").autocomplete = setup ? "new-password" : "current-password";
  $("#gate-password2").style.display = setup ? "block" : "none";
  $("#gate-totp").style.display = !setup && status.totp_enabled ? "block" : "none";
  // Remote first-run needs the token printed in the server log.
  $("#gate-bootstrap").style.display = setup ? "block" : "none";
  $("#gate-submit").textContent = setup ? "Set password" : "Sign in";
  $("#gate-form").dataset.mode = setup ? "setup" : "login";
  $("#gate-error").textContent = "";
}

function hideGate() {
  document.body.classList.remove("locked");
  $("#gate").classList.remove("show");
}

$("#gate-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const setup = event.target.dataset.mode === "setup";
  const password = $("#gate-password").value;
  $("#gate-error").textContent = "";

  try {
    if (setup) {
      if (password !== $("#gate-password2").value) throw new Error("passwords do not match");
      bootstrapToken = $("#gate-bootstrap").value.trim() || null;
      await api("/api/auth/password", { method: "POST", body: JSON.stringify({ password }) });
      bootstrapToken = null;
    } else {
      const body = { password };
      const code = $("#gate-totp").value.trim();
      if (code) body.totp_code = code;
      await api("/api/auth/login", { method: "POST", body: JSON.stringify(body) });
    }
    $("#gate-form").reset();
    hideGate();
    await refresh();
  } catch (err) {
    $("#gate-error").textContent = err instanceof AuthRequired ? "invalid credentials" : err.message;
  }
});

$("#signout").addEventListener("click", async () => {
  await fetch("/api/auth/logout", { method: "POST" });
  location.reload();
});

// ---------------------------------------------------------------- rendering

const TOTAL_TILES = [
  ["requests", "Requests", fmt.format],
  ["errors", "Errors", fmt.format],
  ["input_tokens", "Input tokens", fmt.format],
  ["output_tokens", "Output tokens", fmt.format],
  ["cache_read_input_tokens", "Cache reads", fmt.format],
  ["cost_usd", "Cost", (v) => "$" + v.toFixed(4)],
];

const SETTING_FIELDS = [
  { key: "max_attempts", label: "Max attempts", type: "number", min: 1, max: 10 },
  { key: "sticky_sessions_enabled", label: "Sticky sessions", type: "checkbox" },
  { key: "sticky_ttl_seconds", label: "Sticky TTL (s)", type: "number", min: 0, max: 86400 },
  { key: "health_probe_enabled", label: "Health probes", type: "checkbox" },
  { key: "model_sync_enabled", label: "Model sync", type: "checkbox" },
];

function renderSettings(payload) {
  const s = payload.settings;
  const strategy = payload.available_strategies
    .map((o) => `<option value="${esc(o)}" ${o === s.routing_strategy ? "selected" : ""}>${esc(o)}</option>`)
    .join("");
  const fields = SETTING_FIELDS.map((f) => {
    const value = s[f.key];
    const input = f.type === "checkbox"
      ? `<input type="checkbox" data-setting="${f.key}" ${value ? "checked" : ""}>`
      : `<input type="number" data-setting="${f.key}" value="${esc(value)}" min="${f.min}" max="${f.max}" style="width:100px">`;
    return `<label class="field">${esc(f.label)} ${input}</label>`;
  }).join("");

  $("#settings-row").innerHTML =
    `<label class="field">Strategy <select data-setting="routing_strategy">${strategy}</select></label>` +
    fields +
    `<button id="settings-reset">Reset to defaults</button>`;
  $("#settings-note").textContent = "Changes apply to the next request — no restart.";
}

function renderTrend(points) {
  const el = $("#trend");
  const max = Math.max(...points.map((p) => p.cost_usd), 0);
  if (max <= 0) {
    el.innerHTML = `<div class="empty">no usage recorded in this window yet</div>`;
    return;
  }

  // Inline SVG: no chart library, no build step, and it inherits the theme tokens.
  const W = 1000, H = 140, GAP = 2;
  const width = W / points.length;
  const bars = points.map((p, i) => {
    const h = Math.max(1, (p.cost_usd / max) * (H - 20));
    const x = i * width;
    const title = `${p.day}: ${usd(p.cost_usd)} · ${fmt.format(p.requests)} req`;
    return `<rect class="col" x="${x + GAP / 2}" y="${H - h}" width="${Math.max(1, width - GAP)}" height="${h}">`
      + `<title>${esc(title)}</title></rect>`;
  }).join("");

  el.innerHTML = `
    <svg class="chart" viewBox="0 0 ${W} ${H + 16}" preserveAspectRatio="none" role="img"
         aria-label="Daily cost over the last ${points.length} days">
      ${bars}
      <line class="axis" x1="0" y1="${H}" x2="${W}" y2="${H}"/>
    </svg>
    <div class="sub" style="display:flex; justify-content:space-between; margin-top:4px;">
      <span>${esc(points[0].day)}</span>
      <span>peak ${usd(max)}/day · ${usd(points.reduce((a, p) => a + p.cost_usd, 0))} total</span>
      <span>${esc(points[points.length - 1].day)}</span>
    </div>`;
}

function renderSecurity(status) {
  $("#security-row").innerHTML = `
    <span class="pill ${status.configured ? "ok" : "err"}">
      ${status.configured ? "password set" : "no password"}
    </span>
    <span class="pill ${status.totp_enabled ? "ok" : "warn"}">
      ${status.totp_enabled ? "TOTP on" : "TOTP off"}
    </span>
    <button id="change-password">Change password</button>
    ${status.totp_enabled
      ? `<button id="disable-totp">Disable TOTP</button>`
      : `<button id="enroll-totp">Enable TOTP</button>`}
    <button id="revoke-sessions">Sign out everywhere</button>`;
}

async function refresh() {
  const status = await api("/api/auth/status");
  if (!status.authenticated) {
    showGate(status);
    return;
  }
  hideGate();
  $("#signout").style.display = status.configured ? "" : "none";

  const banner = $("#insecure-banner");
  if (!status.configured) {
    banner.style.display = "";
    banner.textContent =
      "No dashboard password is set. The management API is reachable from this machine "
      + "without authentication — set a password below before exposing this port.";
  } else {
    banner.style.display = "none";
  }

  const [health, accounts, keys, summary, requests, settings, audit, trend, catalog] =
    await Promise.all([
      api("/health"),
      api("/api/accounts"),
      api("/api/keys"),
      api(`/api/usage/summary?window_hours=${$("#window").value}`),
      api("/api/usage/requests?limit=50"),
      api("/api/settings"),
      api("/api/audit?limit=25"),
      api("/api/usage/trend?days=28"),
      api("/api/health/models"),
    ]);

  $("#meta").textContent =
    `v${health.version} · ${accounts.filter((a) => a.available).length}/${accounts.length} accounts available`
    + ` · ${settings.settings.routing_strategy}`;

  $("#totals").innerHTML = TOTAL_TILES.map(([key, label, format]) =>
    `<div class="tile"><div class="label">${label}</div><div class="value">${format(summary.totals[key])}</div></div>`
  ).join("");

  const usageByAccount = Object.fromEntries(summary.by_account.map((r) => [r.account_id, r]));
  table($("#accounts"),
    [{label:"Name"},{label:"Key"},{label:"Status"},{label:"Headroom"},
     {label:"Requests",num:true},{label:"Cost (window)",num:true},{label:"Cost (all time)",num:true},{label:""}],
    accounts,
    (a) => {
      const w = usageByAccount[a.id] ?? {};
      const status = a.available
        ? `<span class="pill ok">available</span>`
        : `<span class="pill err" title="${esc(a.disabled_reason ?? "")}">${a.enabled ? "cooling down" : "disabled"}</span>`;
      const pct = Math.round(a.headroom * 100);
      return `<tr>
        <td>${esc(a.name)}</td>
        <td><code>${esc(a.credential_hint)}</code></td>
        <td>${status}</td>
        <td><div class="bar" title="${pct}%"><i style="width:${pct}%"></i></div></td>
        <td class="num">${fmt.format(a.total_requests)}</td>
        <td class="num">${usd(w.cost_usd)}</td>
        <td class="num">${usd(a.total_cost_usd)}</td>
        <td><button data-toggle="${a.id}" data-enabled="${!a.enabled}">${a.enabled ? "Disable" : "Enable"}</button>
            <button data-delete="${a.id}">Delete</button></td>
      </tr>`;
    });

  renderSettings(settings);
  renderSecurity(status);
  renderTrend(trend);

  const synced = accounts.map((a) => a.models_synced_at).filter(Boolean).sort().pop();
  $("#catalog-note").textContent = synced
    ? `last synced ${new Date(synced).toLocaleString()}`
    : "never synced";
  table($("#catalog"),
    [{label:"Model"},{label:"Name"},{label:"Accounts",num:true},{label:"Context",num:true},{label:"Max output",num:true}],
    catalog,
    (m) => `<tr>
      <td><code>${esc(m.model_id)}</code></td>
      <td>${esc(m.display_name || "—")}</td>
      <td class="num">${fmt.format(m.accounts)}</td>
      <td class="num">${m.max_input_tokens ? fmt.format(m.max_input_tokens) : "—"}</td>
      <td class="num">${m.max_output_tokens ? fmt.format(m.max_output_tokens) : "—"}</td>
    </tr>`);

  table($("#models"),
    [{label:"Model"},{label:"Requests",num:true},{label:"Input",num:true},{label:"Output",num:true},{label:"Cost",num:true}],
    summary.by_model,
    (m) => `<tr><td>${esc(m.model ?? "(unknown)")}</td><td class="num">${fmt.format(m.requests)}</td>
      <td class="num">${fmt.format(m.input_tokens)}</td><td class="num">${fmt.format(m.output_tokens)}</td>
      <td class="num">${usd(m.cost_usd)}</td></tr>`);

  table($("#keys"),
    [{label:"Name"},{label:"Key"},{label:"Status"},{label:"Budget"},{label:"Requests",num:true},{label:"Cost",num:true},{label:""}],
    keys,
    (k) => {
      const budget = k.max_cost_usd_per_window
        ? `$${k.max_cost_usd_per_window} / ${k.window_seconds}s` : "—";
      return `<tr>
        <td>${esc(k.name)}</td><td><code>…${esc(k.key_hint)}</code></td>
        <td>${k.enabled ? '<span class="pill ok">enabled</span>' : '<span class="pill err">disabled</span>'}</td>
        <td>${esc(budget)}</td>
        <td class="num">${fmt.format(k.total_requests)}</td>
        <td class="num">${usd(k.total_cost_usd)}</td>
        <td><button data-delete-key="${k.id}">Delete</button></td>
      </tr>`;
    });

  const accountNames = Object.fromEntries(accounts.map((a) => [a.id, a.name]));
  table($("#requests"),
    [{label:"Time"},{label:"Account"},{label:"Model"},{label:"Status"},{label:"Stream"},
     {label:"Tokens in",num:true},{label:"Tokens out",num:true},{label:"ms",num:true},{label:"Cost",num:true}],
    requests,
    (r) => {
      const cls = r.status_code >= 500 ? "err" : r.status_code >= 400 ? "warn" : "ok";
      return `<tr>
        <td>${new Date(r.created_at).toLocaleTimeString()}</td>
        <td>${esc(accountNames[r.account_id] ?? "—")}</td>
        <td>${esc(r.model ?? "—")}</td>
        <td class="${cls}" title="${esc(r.error ?? "")}">${r.status_code}</td>
        <td>${r.streaming ? "yes" : "no"}</td>
        <td class="num">${fmt.format(r.input_tokens)}</td>
        <td class="num">${fmt.format(r.output_tokens)}</td>
        <td class="num">${fmt.format(r.duration_ms)}</td>
        <td class="num">${usd(r.cost_usd)}</td>
      </tr>`;
    });

  table($("#audit"),
    [{label:"Time"},{label:"Action"},{label:"Target"},{label:"Detail"},{label:"From"},{label:"Result"}],
    audit,
    (e) => `<tr>
      <td>${new Date(e.created_at).toLocaleString()}</td>
      <td>${esc(e.action)}</td>
      <td>${esc(e.target || "—")}</td>
      <td>${esc(e.detail || "—")}</td>
      <td>${esc(e.client_ip || "—")}</td>
      <td class="${e.ok ? "ok" : "err"}">${e.ok ? "ok" : "failed"}</td>
    </tr>`);
}

// ---------------------------------------------------------------- actions

function formPayload(form) {
  const payload = {};
  for (const [key, raw] of new FormData(form)) {
    if (raw === "") continue;
    payload[key] = form.elements[key].type === "number" ? Number(raw) : raw;
  }
  return payload;
}

$("#account-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  await guard(async () => {
    await api("/api/accounts", { method: "POST", body: JSON.stringify(formPayload(event.target)) });
    event.target.reset();
    await refresh();
  });
});

$("#key-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  await guard(async () => {
    const created = await api("/api/keys", { method: "POST", body: JSON.stringify(formPayload(event.target)) });
    event.target.reset();
    toast(`Key created — copy it now, it is not shown again: <code>${esc(created.api_key)}</code>`);
    await refresh();
  });
});

async function guard(fn) {
  try {
    await fn();
  } catch (err) {
    if (err instanceof AuthRequired) {
      showGate(await api("/api/auth/status"));
    } else {
      toast(esc(err.message), true);
    }
  }
}

document.addEventListener("change", async (event) => {
  const key = event.target.dataset.setting;
  if (!key) return;
  const value = event.target.type === "checkbox" ? event.target.checked : Number(event.target.value);
  await guard(async () => {
    await api("/api/settings", { method: "PATCH", body: JSON.stringify({ [key]: value }) });
    await refresh();
  });
});

document.addEventListener("click", async (event) => {
  const d = event.target.dataset;
  const id = event.target.id;

  await guard(async () => {
    if (d.toggle) {
      await api(`/api/accounts/${d.toggle}`, {
        method: "PATCH",
        body: JSON.stringify({ enabled: d.enabled === "true" }),
      });
    } else if (d.delete) {
      if (!confirm("Delete this account? Its request history is kept.")) return;
      await api(`/api/accounts/${d.delete}`, { method: "DELETE" });
    } else if (d.deleteKey) {
      if (!confirm("Delete this API key? Clients using it will start failing.")) return;
      await api(`/api/keys/${d.deleteKey}`, { method: "DELETE" });
    } else if (id === "sync-models") {
      const counts = await api("/api/health/sync-models", { method: "POST" });
      toast(`Synced ${Object.keys(counts).length} account(s).`);
    } else if (id === "probe-now") {
      const results = await api("/api/health/probe", { method: "POST" });
      toast(results.length
        ? `Probed ${results.length} account(s); ${results.filter((r) => r.ok).length} recovered.`
        : "No unhealthy accounts to probe.");
    } else if (id === "settings-reset") {
      await api("/api/settings/reset", { method: "POST" });
    } else if (id === "change-password") {
      const current = prompt("Current password:");
      if (current === null) return;
      const next = prompt("New password (min 8 characters):");
      if (!next) return;
      await api("/api/auth/password", {
        method: "POST",
        body: JSON.stringify({ password: next, current_password: current }),
      });
      toast("Password changed. Other sessions were signed out.");
    } else if (id === "enroll-totp") {
      const enrollment = await api("/api/auth/totp/enroll", { method: "POST" });
      $("#totp-setup").innerHTML = `
        <div class="toast">
          Add this secret to your authenticator, then confirm a code to switch TOTP on.<br>
          <code>${esc(enrollment.secret)}</code>
          <div style="margin-top:10px; display:flex; gap:8px;">
            <input id="totp-code" placeholder="6-digit code" inputmode="numeric" style="width:140px">
            <button id="confirm-totp">Confirm</button>
          </div>
        </div>`;
      return;
    } else if (id === "confirm-totp") {
      await api("/api/auth/totp/confirm", {
        method: "POST",
        body: JSON.stringify({ code: $("#totp-code").value.trim() }),
      });
      $("#totp-setup").innerHTML = "";
      toast("TOTP enabled.");
    } else if (id === "disable-totp") {
      if (!confirm("Disable TOTP? Sign-in will need only the password.")) return;
      await api("/api/auth/totp", { method: "DELETE" });
    } else if (id === "revoke-sessions") {
      if (!confirm("Sign out every dashboard session, including this one?")) return;
      await api("/api/auth/sessions/revoke-all", { method: "POST" });
      location.reload();
      return;
    } else {
      return;
    }
    await refresh();
  });
});

$("#refresh").addEventListener("click", () => guard(refresh));
$("#window").addEventListener("change", () => guard(refresh));

guard(refresh);
setInterval(() => refresh().catch(() => {}), 15000);
</script>
</body>
</html>
